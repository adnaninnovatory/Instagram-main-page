<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram</title>
    <link
      rel="shortcut icon"
      href="../assets/Instagram_icon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="container">
      <div class="top">
        <div class="mobileImg">
          <img
            src="../assets/login_images/home-phones-2x.png"
            alt=""
            id="mobile"
          />
          <img
            src="../assets/login_images/screenshot1-2x.png"
            alt=""
            id="innerImg"
          />
        </div>
        <div class="loginForm">
          <div id="form">
            <!-- <h2>Instagram</h2> -->
            <div class="alpha">
              <img src="../assets/alphabet.png" alt="" id="insta" />
            </div>
            <form id="loginForm">
              <input
                type="text"
                placeholder="Phone number, username, or email"
                id="username"
              />
              <input type="password" placeholder="Password" id="password" />
              <input type="submit" value="Log in" id="loginBtn" />
            </form>
            <div class="or">OR</div>
            <div class="loginWFB">
              <ion-icon name="logo-facebook"></ion-icon>
              <span>Log in with Facebook</span>
            </div>
            <div class="forgotPassword">
              <a href="./forgotPassword.html">Forgot password?</a>
            </div>
          </div>
          <div class="signUpLink">
            Don't have an account?<a href="./register.html">Sign up</a>
          </div>
          <div class="getApp">
            Get the app.
            <div class="storeImgs">
              <a
                href="https://play.google.com/store/apps/details?id=com.instagram.android&referrer=ig_mid%3D744E8F4B-B47E-46A2-B61E-58EDB9BCC2EB%26utm_campaign%3DsignupPage%26utm_content%3Dlo%26utm_source%3Dinstagramweb%26utm_medium%3Dbadge%26original_referrer%3Dhttps://www.google.com/&pli=1"
              >
                <img src="../assets/login_images/c5Rp7Ym-Klz.png" alt=""
              /></a>

              <a
                href="ms-windows-store://pdp/?productid=9nblggh5l9xt&referrer=appbadge&source=www.instagram.com&mode=mini&pos=0%2C0%2C1920%2C1008"
                ><img src="../assets/login_images/EHY6QnZYdNX.png" alt=""
              /></a>
            </div>
          </div>
        </div>
      </div>
      <footer class="bottom">
        <ul>
          <li><a href="#">Meta</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Jobs</a></li>
          <li><a href="#">Help</a></li>
          <li><a href="#">API</a></li>
          <li><a href="#">Privacy</a></li>
          <li><a href="#">Terms</a></li>
          <li><a href="#">Locations</a></li>
          <li><a href="#">Instagram Lite</a></li>
          <li><a href="#">Threads</a></li>
          <li><a href="#">Contact Uploading & Non-Users</a></li>
          <li><a href="#">Meta Verified</a></li>
          <li>
            <select name="" id="">
              <option value="">English</option>
              <option value="">Spanish</option>
              <option value="">Arabic</option>
              <option value="">Urdu</option>
            </select>
          </li>
          <li>&copy; 2025 Instagram from Meta</li>
        </ul>
      </footer>
    </div>

    <script>
      let imgArr = [
        "../assets/login_images/screenshot1-2x.png",
        "../assets/login_images/screenshot2-2x.png",
        "../assets/login_images/screenshot3-2x.png",
        "../assets/login_images/screenshot4-2x.png",
      ];
      let index = 0;
      setInterval(() => {
        let changingImg = document.getElementById("innerImg");
        index = (index + 1) % imgArr.length;
        changingImg.src = imgArr[index];

        changingImg.classList.add("active");
      }, 4000);

      setTimeout(() => {}, 3000);
      var userData;
      let submit = document.getElementById("loginBtn");
      document.getElementById('loginForm').addEventListener('submit', handleSubmit);
      function handleSubmit(e) {
        e.preventDefault()
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;
        const getData = async () => {
          // Fetch data and await the promise to resolve
          const res = await fetch("../data/users.json");
          const users = await res.json(); // Parse the JSON data
          userData = users; // Assign the users data to userData variable
          console.log(users)
        };

        getData().then(() => {
          const user = userData.users.find((user) => user.username == username);

          if (user && user.password == password) {
            localStorage.setItem("loggedInUser", JSON.stringify(user));
            window.location.href = "index.html";
          } else {
            // Invalid username or password
            alert("Wrong Credentials");
          }
        }).catch(error=>{
          console.error('Error fetching users:', error);
          alert('There was an error with the login process.');
        })
      }

      
    </script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
